{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
    <div class="card border-0 shadow-sm rounded-4" style="max-width: 600px; margin: 0 auto;">
        <div class="card-header bg-primary text-white p-4 rounded-top-4">
            <h4 class="fw-bold mb-0">Yeni Diyet Programı</h4>
            <p class="mb-0 opacity-75">Danışan: {{ client.get_full_name }}</p>
        </div>
        <div class="card-body p-4">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="fw-bold mb-1">Program Adı</label>
                    {{ form.title }}
                </div>
                <div class="row g-3 mb-4">
                    <div class="col-6">
                        <label class="fw-bold mb-1">Başlangıç</label>
                        {{ form.start_date }}
                    </div>
                    <div class="col-6">
                        <label class="fw-bold mb-1">Bitiş</label>
                        {{ form.end_date }}
                    </div>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary rounded-pill fw-bold py-3">
                        Oluştur ve Düzenlemeye Başla ->
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
